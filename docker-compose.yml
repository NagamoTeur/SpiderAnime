version: '3.8'

services:
  spideranime:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spideranime
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
