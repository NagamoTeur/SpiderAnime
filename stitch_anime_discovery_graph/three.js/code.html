<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_5 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_5" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_5');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(window.device_pixel_ratio || 1);
container.appendChild(renderer.domElement);

const nodes = [];
const lines = [];
const nodeCount = 12;
const connections = [];

const geometry = new THREE.SphereGeometry(0.1, 16, 16);
const nodeMaterial = new THREE.MeshBasicMaterial({ color: 0x8b5cf6 }); // Neon Violet
const cyanMaterial = new THREE.MeshBasicMaterial({ color: 0x06b6d4 }); // Cyan

// Create nodes
for (let i = 0; i < nodeCount; i++) {
    const node = new THREE.Mesh(geometry, i % 3 === 0 ? cyanMaterial : nodeMaterial);
    node.position.set(
        (Math.random() - 0.5) * 8,
        (Math.random() - 0.5) * 8,
        (Math.random() - 0.5) * 4
    );
    node.velocity = new THREE.Vector3(
        (Math.random() - 0.5) * 0.01,
        (Math.random() - 0.5) * 0.01,
        (Math.random() - 0.5) * 0.01
    );
    scene.add(node);
    nodes.push(node);
}

// Create lines (dynamic)
const lineMaterial = new THREE.LineBasicMaterial({ color: 0x31394d, transparent: true, opacity: 0.3 });

function updateLines() {
    // Remove old lines
    lines.forEach(l => scene.remove(l));
    lines.length = 0;

    for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
            const dist = nodes[i].position.distanceTo(nodes[j].position);
            if (dist < 4) {
                const points = [nodes[i].position, nodes[j].position];
                const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
                const line = new THREE.Line(lineGeo, lineMaterial);
                scene.add(line);
                lines.push(line);
            }
        }
    }
}

camera.position.z = 8;

function animate() {
    requestAnimationFrame(animate);
    
    nodes.forEach(node => {
        node.position.add(node.velocity);
        
        // Bounce off boundaries
        if (Math.abs(node.position.x) > 5) node.velocity.x *= -1;
        if (Math.abs(node.position.y) > 5) node.velocity.y *= -1;
        if (Math.abs(node.position.z) > 3) node.velocity.z *= -1;
        
        node.rotation.x += 0.01;
        node.rotation.y += 0.01;
    });

    updateLines();
    renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
});
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_5 -->
</body>
</html>
